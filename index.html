<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Facts</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <h1>Country Facts</h1>
        <!-- Search form -->
        <form id="searchForm">
            <label for="country">
                Enter a country name:
            </label>
            <input
                type="text"
                id="country"
                placeholder="e.g. Ethiopia"
                value="Ethiopia"
                required
            >
            <button type="submit">
                Search
            </button>
        </form>
        <!-- Country facts will be displayed here -->
        <ul id="facts"></ul>
    </main>
    <script src="app.js"></script>
</body>
</html>
