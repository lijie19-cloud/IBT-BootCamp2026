<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addis Market Shopping List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="container">
    <h1>Addis Market Shopping List</h1>

    <form id="add-form">
      <div>
        <label for="name">Item name</label>
        <input
          type="text"
          id="name"
          placeholder="e.g. Tomatoes"
          required
        >
      </div>

      <div>
        <label for="price">Price (ETB)</label>
        <input
          type="number"
          id="price"
          placeholder="e.g. 150"
          min="0"
          step="0.01"
          required
        >
      </div>

      <button type="submit">Add Item</button>
    </form>
    <p>
      Total: <strong id="total">0.00 ETB</strong>
    </p>
    <ul id="list"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
