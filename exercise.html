<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM and Events Exercises</title>
</head>
<body>

  <section>
    <h2>Exercise 1: textContent and classList</h2>

    <h1 id="title">Old Title</h1>

    <button id="change-title">Change Title</button>
  </section>

  <hr>


  <section>
    <h2>Exercise 2: Ethiopian Cities</h2>

    <ul id="city-list"></ul>
  </section>

  <hr>

  <section>
    <h2>Exercise 3: Event Bubbling</h2>

    <div id="box">
      <button id="click-button">Click Me</button>
    </div>
  </section>

  <hr>

  <section>
    <h2>Exercise 4: Event Delegation</h2>

    <ul id="shopping-list">
      <li>
        Tomatoes
        <button class="delete">Delete</button>
      </li>

      <li>
        Milk
        <button class="delete">Delete</button>
      </li>

      <li>
        Bread
        <button class="delete">Delete</button>
      </li>
    </ul>
  </section>

  <hr>

  <section>
    <h2>Exercise 5: Form and List</h2>

    <form id="item-form">
      <label for="item-input">Add an item:</label>

      <input
        type="text"
        id="item-input"
        placeholder="Enter an item"
      >

      <button type="submit">Add</button>
    </form>

    <ul id="item-list"></ul>
  </section>

  <script src="exercise.js"></script>
</body>
</html>
