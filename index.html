<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup Form</title>
  </head>
  <body>
    <h1>Signup Form</h1>
    <form id="signupForm">
      <div>
        <label for="name">Full Name:</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your full name"
        />
      </div>
      <br />
      <div>
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="0911234567" />
      </div>
      <br />
      <button type="submit">Sign Up</button>
      <!-- Dedicated error/success area -->
      <p id="error"></p>
    </form>
    <hr />
    <h2>Registered People</h2>
    <p id="count"></p>
    <ul id="peopleList"></ul>
    <script src="app.js"></script>
  </body>
</html>
