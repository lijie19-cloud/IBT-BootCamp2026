<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birr Watch</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Birr Watch</h1>
    <p id="status">Loading rates...</p>
    <!-- Conversion Form -->
    <form id="convert-form">
      <div class="form-group">
        <label for="amount">Amount (ETB):</label>
        <input id="amount" type="number" value="100" min="0.01" step="any" required />
      </div>
      <div class="form-group">
        <label for="currency">Exchange To:</label>
        <select id="currency"></select>
      </div>
      <div class="actions">
        <button type="submit">Convert</button>
        <button type="button" id="watch">Add to Watchlist</button>
      </div>
    </form>
    <p id="result"></p>
    <h2>Watchlist</h2>
    <ul id="watchlist"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
